services:
  job-alerts:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - JOBS_DB_PATH=/app/data/jobs.db
    volumes:
      # Your customized config (copy config.example.yaml -> config.yaml first).
      - ./config.yaml:/app/config.yaml:ro
      # Persist dedupe state so you don't get re-notified after a restart.
      - ./data:/app/data
